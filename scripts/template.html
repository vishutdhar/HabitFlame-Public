<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HabitFlame">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{base}}/app-icon.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base}}/app-icon.png">
<link rel="icon" type="image/png" href="{{base}}/app-icon.png">
<link rel="apple-touch-icon" href="{{base}}/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{base}}/styles.css?v={{css_version}}">
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="{{base}}/"><span class="mark" aria-hidden="true"></span>HabitFlame</a>
  <nav class="top-links" aria-label="Site">
    <a href="{{base}}/#guides">Guides</a>
    <a href="{{base}}/support.html">Support</a>
    <a class="store-link" href="{{app_store_url}}">App Store</a>
  </nav>
</header>
<main id="main">
{{main}}
</main>
<footer class="foot">
  <nav class="foot-links" aria-label="Legal">
    <a href="{{base}}/support.html">Support</a>
    <a href="{{base}}/privacy-policy.html">Privacy Policy</a>
    <a href="{{base}}/terms-of-service.html">Terms of Service</a>
    <a href="mailto:{{contact_email}}">{{contact_email}}</a>
  </nav>
  <p class="foot-brand"><a href="{{brand_url}}">{{brand_footer}}</a></p>
  <p class="foot-copy">&copy; {{year}} HabitFlame</p>
</footer>
</body>
</html>
